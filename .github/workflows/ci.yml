name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a previous run of this workflow when a new push lands on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test (race + cover)
        run: go test -race -coverprofile=coverage.txt ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: coverage.txt

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet
        run: go vet ./...

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Files need gofmt:"
            gofmt -l .
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2   # pinned for reproducibility
          args: --timeout=5m

  build:
    name: smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go build
        run: go build -o a2migrate ./cmd/a2migrate
      - name: version smoke test
        run: ./a2migrate version
      - name: help smoke test
        run: ./a2migrate --help

  goreleaser:
    # Dry-run GoReleaser's release pipeline on every push so we catch
    # build/ldflag/CGO regressions before tagging. Pin goreleaser to a
    # specific version for reproducibility.
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Install goreleaser
        run: |
          curl -sfL https://goreleaser.com/static/install | sh -s -- -b /usr/local/bin v2.17.1
          goreleaser --version
      - name: Validate config
        run: goreleaser check
      - name: Build snapshot
        # --skip=publish so we don't touch the release.
        # --skip=announce so no announcement fires from a snapshot.
        run: goreleaser release --snapshot --skip=publish,announce,validate --clean
      - name: List built artifacts
        run: ls -la dist/
      - name: Smoke test the Linux binary
        run: ./dist/a2migrate_linux_amd64_v1/a2migrate version
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a2migrate-snapshot
          path: dist/
          if-no-files-found: error
          retention-days: 7
