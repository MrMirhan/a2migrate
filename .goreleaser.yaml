# GoReleaser configuration for a2migrate.
# Docs: https://goreleaser.com
#
# CI flow:
#   1. Tag a release:  git tag -s v0.1.0 -m "..."
#   2. Push the tag:   git push origin v0.1.0
#   3. The release workflow runs GoReleaser, builds 5 OS/arch targets,
#      produces .tar.gz / .zip archives + .sha256 files, drafts a
#      GitHub Release from CHANGELOG.md entries, attaches binaries.

version: 2

project_name: a2migrate

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: a2migrate
    main: ./cmd/a2migrate
    binary: a2migrate
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mirhan/a2migrate/internal/version.Version={{ .Version }}
      - -X github.com/mirhan/a2migrate/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/mirhan/a2migrate/internal/version.BuildDate={{ .CommitDate }}
    # Pure-Go SQLite is the only CGO surface; disable elsewhere for
    # smaller, more portable binaries.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # windows/arm64 isn't supported by Go's sqlite driver on some toolchains.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    # Produces:
    #   a2migrate_Linux_x86_64.tar.gz
    #   a2migrate_Darwin_arm64.tar.gz
    #   a2migrate_Windows_x86_64.zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

# Artifact signing — uncomment once cosign is configured and the release
# workflow has a signing identity. An enabled block without `args` runs
# cosign with no arguments and fails every release.
# signs:
#   - artifacts: checksum
#     cmd: cosign
#     args: ["sign-blob", "--output-signature", "${signature}", "--bundle", "${output}", "${artifact}"]
#     signature: '${artifact}.sig'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Conventional commits parsed automatically.
  # Disable if your release commits don't follow the spec.
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug Fixes
      regexp: "^fix"
      order: 1
    - title: Performance
      regexp: "^perf"
      order: 2
    - title: Refactors
      regexp: "^refactor"
      order: 3
    - title: Documentation
      regexp: "^docs"
      order: 4
    - title: Tests
      regexp: "^test"
      order: 5
    - title: Build / CI
      regexp: "^(build|ci)"
      order: 6
    - title: Other
      order: 7

# GitHub release notes sourced from CHANGELOG.md diff.
release:
  github:
    owner: MrMirhan
    name: a2migrate
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## a2migrate {{ .Version }}

    Released {{ .CommitDate }}. Binary downloads below.
  # No .Os/.Arch here: release notes render once, not per artifact, so
  # those keys are undefined and abort the release.
  footer: |

    ## Install

    ```sh
    curl -fsSL https://github.com/MrMirhan/a2migrate/releases/download/v{{ .Version }}/a2migrate_Linux_x86_64.tar.gz | tar -xz
    sudo mv a2migrate /usr/local/bin/
    a2migrate version
    ```

    Swap `Linux_x86_64` for `Linux_arm64`, `Darwin_arm64`,
    `Darwin_x86_64`, or `Windows_x86_64` as needed. Verify against
    `a2migrate_{{ .Version }}_SHA256SUMS`.

# Homebrew formula, pushed to a separate tap repo on every release.
#
# Two prerequisites, or the release job fails:
#   1. github.com/MrMirhan/homebrew-tap must exist (empty is fine).
#   2. HOMEBREW_TAP_GITHUB_TOKEN must be a repo secret holding a token
#      with contents:write on that tap. The workflow's built-in
#      GITHUB_TOKEN cannot push to a different repository.
brews:
  - name: a2migrate
    repository:
      owner: MrMirhan
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/MrMirhan/a2migrate"
    description: "Migrate AI coding sessions, skills, agents, and MCP servers between Claude Code and OpenCode."
    license: "Apache-2.0"
    commit_author:
      name: MrMirhan
      email: hamzaalmendi@gmail.com
    install: |
      bin.install "a2migrate"
    test: |
      system "#{bin}/a2migrate", "version"

