# a2migrate multi-endpoint sync config.
# Generated by `a2migrate init`. Edit in place; version stays at 1.

version = 1

# Each [[endpoint]] declares one target machine. a2migrate reaches the
# machine according to `kind` and runs the per-tool sync against the
# data root (`path`). `tools = [...]` scopes the endpoint to a subset
# of supported CLIs (omit for all).

# --- Example: a workstation's external drive with OpenCode ----------
[[endpoint]]
id   = "workstation-b"
kind = "local"
path = "/Volumes/external/a2migrate"
tools = ["opencode"]

# --- Example: a remote VDS reached over SSH -----------------------------
[[endpoint]]
id   = "vds-istanbul"
kind = "ssh"
host = "10.0.0.5"
user = "mirhan"
path = "/home/mirhan/.local/share/a2migrate"
tools = ["claude_code", "opencode"]
